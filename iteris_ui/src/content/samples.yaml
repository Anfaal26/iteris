# Curated sample images (spec §6 sample tiles, §9 dataset explorer).
# thumbnailUrl/maskUrl point at real CAMUS/BRISC image+ground-truth-mask pairs
# bundled under public/samples/, sourced from the project's held-out
# test split (D:\iteris\test-val-sets\holdout\{CAMUS,BRISC}\test\ locally —
# completely unseen during training). bestDice is the real Phase A mean Dice
# (see src/pages/Research/data/evaluationResults.ts) for the closest-matching
# structure/class across the three deployed models — not a per-image score,
# since per-sample scoring requires running inference.
#
# BRISC note: the held-out manifest's own tumor_type column tags the
# meningioma case here as "unknown" — its filename token is 'me', which
# iteris/ingestion.py's TYPE_MAP doesn't recognise (it expects 'mn'), so it
# falls through to the unknown fallback. Verified against every BRISC test
# manifest row (gl->glioma, pi->pituitary, me->unknown, no exceptions) that
# 'me' is meningioma, not a real non-tumour class - labelled accordingly here.

