# Curated sample images (spec §6 sample tiles, §9 dataset explorer).
# thumbnailUrl/maskUrl point at real CAMUS/BRISC image+ground-truth-mask pairs
# bundled under public/samples/ (sourced from a small local held-out set). Where
# no real pair exists yet, thumbnailB64 is left empty and tiles fall back to a
# procedural placeholder. bestDice is the real Phase A mean Dice (see
# src/pages/Research/data/evaluationResults.ts) for the closest-matching
# structure/class across the three deployed models — not a per-image score,
# since per-sample scoring requires running inference.

